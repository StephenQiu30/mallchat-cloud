name: CI

on:
  push:
    branches:
      - main
      - "m*"
  pull_request:
    branches:
      - main
      - "m*"
  workflow_dispatch:

jobs:
  backend-quality-gate:
    name: Backend quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check required files
        run: bash scripts/validate-repository.sh

      - name: Validate recovery scripts
        run: |
          bash -n scripts/backup-im-core-tables.sh scripts/verify-im-core-data-recovery.sh
          bash scripts/backup-im-core-tables.sh --dry-run
          bash scripts/verify-im-core-data-recovery.sh --dry-run
          if RECOVERY_DATABASE='bad`name' bash scripts/verify-im-core-data-recovery.sh --dry-run >/tmp/mallchat-bad-recovery-db.out 2>&1; then
            echo "invalid recovery database was accepted" >&2
            exit 1
          fi

      - name: Run engineering contract guards
        run: |
          mvn -B -pl mallchat-service/mallchat-chat-service -am -Dtest=ChatApiContractConsistencyTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-log-service -am -Dtest=LogApiContractConsistencyTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-file-service -am -Dtest=FileUploadContractConsistencyTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-notification-service -am -Dtest=NotificationApiContractConsistencyTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-user-service -am -Dtest=UserApiContractConsistencyTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-ai-service -am -Dtest=AiApiContractConsistencyTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-gateway -am -Dtest=GatewayAuthWhitelistConfigTest,RateLimitConfigTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-common/mallchat-common-rabbitmq -am -Dtest=RabbitMqSenderTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Run backend focused tests
        run: |
          mvn -B -pl mallchat-common/mallchat-common-websocket -am -Dtest=ChannelManagerTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-chat-service -am -Dtest=ChatRoomMemberServiceImplTest,UserFriendServiceImplTest,OpsMetricsRecorderTest,ImCoreConsistencyCheckServiceImplTest,RecoveryDryRunServiceImplTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-chat-service,mallchat-service/mallchat-notification-service -am -Dtest=ChatRoomServiceImplTest,ChatRoomJoinApplyServiceImplTest,ChatMessageHelperTest,ChatMessageServiceImplTest,ChatSessionServiceImplTest,ChatMomentServiceImplTest,ChatReportServiceImplTest,ChatMessagePushHandlerTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-file-service -am -Dtest=FileUploadValidatorTest,FileUploadRecordRecorderTest,FileServiceApplicationTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -pl mallchat-service/mallchat-log-service -am -Dtest=OperationLogServiceImplTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Compile backend modules
        run: mvn -B -DskipTests compile

      - name: Validate Docker Compose config
        run: docker compose config >/tmp/mallchat-compose-config.txt
